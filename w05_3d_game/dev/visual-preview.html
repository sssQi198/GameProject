<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Wrong Floor — visual preview</title>
    <style>
      body { margin: 0; background: #101215; color: #cfc9bb; font: 12px/1.5 monospace; }
      h2 { margin: 8px 12px; font-size: 13px; font-weight: normal; letter-spacing: .1em; }
      #board { display: block; margin: 0 12px; width: 1024px; height: 384px; background: #000; }
      #stage { display: block; margin: 12px; width: 640px; height: 480px; background: #000; }
      .row { display: flex; gap: 12px; align-items: flex-start; }
    </style>
  </head>
  <body>
    <h2>level 2 — blackboard texture</h2>
    <div class="row">
      <canvas id="board" width="1024" height="384"></canvas>
    </div>

    <h2>level 3 — curtain face (3D)</h2>
    <canvas id="stage" width="640" height="480"></canvas>

    <script type="module">
      const status = [];
      try {
        const THREE = await import('../vendor/three.module.js');
        const { createAnomaly } = await import('../src/anomalies.js');

        // --- 黑板：把 CanvasTexture 的原始 canvas 拷出来看 ---
        const board = createAnomaly(2);
        let boardCanvas = null;
        board.group.traverse((node) => {
          if (node.isMesh && node.material?.map?.image) boardCanvas = node.material.map.image;
        });
        const out = document.querySelector('#board');
        const ctx = out.getContext('2d');
        if (boardCanvas) {
          ctx.drawImage(boardCanvas, 0, 0, out.width, out.height);
          status.push('board texture: copied');
        } else {
          status.push('board texture: MISSING');
        }

        // --- 窗帘脸：单帧渲染 ---
        const canvas = document.querySelector('#stage');
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
        renderer.setPixelRatio(1);
        renderer.setSize(640, 480, false);
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.1;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0c0f);

        const curtain = createAnomaly(3);
        // 预览时把脸挪到原点正前方，方便正面看细节
        curtain.group.position.set(0, 1.56, 0);
        scene.add(curtain.group);
        // 让脸睁眼、嘴巴张开
        curtain.update(0.016, { time: 1.2, flickerDark: true, audio: { scratch() {} } });
        curtain.update(0.016, { time: 1.3, flickerDark: true, audio: { scratch() {} } });

        scene.add(new THREE.AmbientLight(0xa9b4c4, 1.2));
        const key = new THREE.PointLight(0xffd9b0, 26, 8, 2);
        key.position.set(0.8, 1.9, 1.6);
        scene.add(key);
        const fill = new THREE.PointLight(0x6f8196, 10, 8, 2);
        fill.position.set(-1.2, 1.4, 1.4);
        scene.add(fill);

        const camera = new THREE.PerspectiveCamera(40, 640 / 480, 0.02, 20);
        // group 转了 π，脸朝 -Z，所以相机放在 -Z 一侧
        camera.position.set(0.02, 1.58, -1.05);
        camera.lookAt(0, 1.54, 0);

        renderer.render(scene, camera);
        status.push('curtain render: done');
      } catch (error) {
        status.push('error: ' + error.message);
      }
      document.body.dataset.preview = status.join(' | ');
      console.log(status.join(' | '));
    </script>
  </body>
</html>
