<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>错层 Wrong Floor</title>
    <link rel="stylesheet" href="./styles/main.css" />
    <style>
/* devtools start */
#dev-panel {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
  z-index: 9999; width: 420px; max-height: 80vh; overflow-y: auto;
  background: rgba(8,10,16,0.92); backdrop-filter: blur(8px);
  border: 1px solid rgba(160,180,255,0.25); border-radius: 12px;
  color: #c8d0e8; font-family: system-ui, sans-serif; font-size: 13px;
  box-shadow: 0 8px 40px rgba(0,0,0,0.6);
}
#dev-panel.hidden { display: none; }
#dev-panel .dev-card { display: flex; flex-direction: column; gap: 4px; }
#dev-panel header {
  display: flex; justify-content: space-between; align-items: center;
  padding: 8px 14px; background: rgba(40,60,160,0.25);
  border-bottom: 1px solid rgba(160,180,255,0.2); border-radius: 12px 12px 0 0;
}
#dev-panel header h3 { margin: 0; font-size: 14px; color: #90b0ff; }
#dev-close {
  background: none; border: none; color: #889;
  cursor: pointer; font-size: 18px; padding: 0 4px;
}
#dev-close:hover { color: #f88; }
#dev-panel .dev-body { padding: 8px 14px; }
#dev-panel .dev-section {
  margin: 8px 0 4px; font-size: 11px; color: #7090c0; text-transform: uppercase; letter-spacing: 0.5px;
}
#dev-panel .dev-grid {
  display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 4px;
}
#dev-panel .dev-grid button, #dev-panel .dev-actions button {
  background: rgba(60,80,180,0.3); border: 1px solid rgba(100,130,220,0.25);
  color: #c0d0f0; border-radius: 5px; padding: 4px 10px; cursor: pointer;
  font-size: 12px; white-space: nowrap;
}
#dev-panel .dev-grid button:hover { background: rgba(80,110,220,0.45); }
#dev-panel .dev-grid button.active { background: rgba(80,200,80,0.35); border-color: #4c4; }
#dev-panel footer {
  padding: 6px 14px; font-size: 11px; color: #567; border-top: 1px solid rgba(160,180,255,0.12);
  display: flex; justify-content: space-between;
}
#dev-hint {
  margin: 6px 0 0; padding: 5px 8px; background: rgba(80,200,80,0.12);
  border: 1px solid rgba(80,200,80,0.25); border-radius: 4px; color: #8d8; font-size: 12px;
}
#dev-hint.hidden { display: none; }
.dev-esc-row {
  margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.08);
}
#btn-dev-panel {
  background: rgba(80,110,220,0.3); border: 1px solid rgba(100,130,220,0.35);
  color: #a0c0ff; border-radius: 5px; padding: 5px 12px; cursor: pointer; font-size: 13px; width: 100%;
}
#btn-dev-panel:hover { background: rgba(80,110,220,0.5); }
#btn-dev-panel span { display: inline-block; margin-left: 6px; font-size: 11px; color: #7a8; }
/* devtools end */
    </style>
  </head>
  <body>
    <div id="app" class="screen-open">
      <canvas id="game-canvas"></canvas>
      <div id="vignette"></div>
      <div id="danger"></div>

      <div id="viewfinder" class="hidden">
        <div id="vf-screen">
          <div id="vf-tint"></div>
          <div id="vf-grain"></div>
          <div id="vf-overlay"></div>
          <div id="vf-frame">
            <span class="vf-corner tl"></span>
            <span class="vf-corner tr"></span>
            <span class="vf-corner bl"></span>
            <span class="vf-corner br"></span>
            <div id="vf-focus"></div>
            <p id="vf-status">STBY</p>
          </div>
        </div>
      </div>

      <div id="hud" class="hidden">
        <header class="hud-top">
          <div>
            <p id="record">记录  0 / 5</p>
            <p id="timer">00:00</p>
            <p id="objective">跟着前面的人</p>
          </div>
          <button id="btn-mute-hud" type="button" data-mute>Mute  静音</button>
        </header>
        <p id="chase" class="hidden">反方向 · 按住 Shift · EXIT</p>
        <div id="crosshair"></div>
        <p id="subtitle" aria-live="polite"></p>
        <p id="prompt"></p>
      </div>

      <button id="btn-exit-demo" class="hidden" type="button">Exit Demo  退出演示</button>
      <p id="demo-badge" class="hidden">DEMO</p>

      <section id="menu">
        <!-- 设计稿舞台：1744x901 逻辑坐标，元素按原图位置/尺寸摆放，纯 CSS 等比缩放 -->
        <div class="menu-stage">
          <img class="ui-el ui-eyebrow" src="./assets/ui/eyebrow.png" alt="Wrong Floor" draggable="false" />
          <h1 class="ui-el ui-title title-img">
            <img src="./assets/ui/title.png" alt="错层" draggable="false" />
          </h1>
          <img class="ui-el ui-logline" src="./assets/ui/logline.png" alt="拍下教室里不存在的东西。看见那双眼睛之后，跑。" draggable="false" />
          <button id="btn-start" class="ui-el ui-btn" type="button" aria-label="Start 开始游戏">
            <img src="./assets/ui/btn-start.png" alt="" draggable="false" />
          </button>
          <button id="btn-demo" class="ui-el ui-btn" type="button" aria-label="Watch Demo 观看演示">
            <img src="./assets/ui/btn-demo.png" alt="" draggable="false" />
          </button>
          <img class="ui-el ui-volume-label" src="./assets/ui/volume-label.png" alt="Volume 音量" draggable="false" />
          <div class="ui-el ui-volume">
            <input id="menu-volume" type="range" min="0" max="1" step="0.01" value="0.4" aria-label="Volume 音量" />
          </div>
          <button id="btn-mute-menu" class="ui-el ui-mute mute-toggle" type="button" data-mute aria-label="Mute 静音">
            <img src="./assets/ui/mute.png" alt="" draggable="false" />
            <i class="mute-check" aria-hidden="true"></i>
          </button>
          <img class="ui-el ui-controls" src="./assets/ui/controls.png" alt="WASD 移动 · Mouse 环顾 · Shift 冲刺；E: 拾起 / 拿出 / 收起相机 · F: 拍摄；M 静音 · Esc 暂停 · 方向键切换标向" draggable="false" />
          <p id="menu-note" class="ui-el"></p>
        </div>
      </section>

      <section id="screen-panel" class="hidden">
        <div class="menu-card">
          <h2 id="panel-title"></h2>
          <p id="panel-text"></p>
          <div class="menu-actions">
            <button id="btn-resume" type="button">Resume  继续</button>
            <button id="btn-retry" type="button">Retry  再试一次</button>
            <button id="btn-restart" type="button">Restart  重新开始</button>
            <button id="btn-back" type="button">Menu  返回标题</button>
          </div>
          <label class="volume">
            Volume  音量
            <input id="panel-volume" type="range" min="0" max="1" step="0.01" value="0.4" />
          </label>
          <!-- devtools start -->
          <div class="dev-esc-row">
            <button id="btn-dev-panel" type="button">Dev Panel<span>开发者</span></button>
          </div>
          <!-- devtools end -->
        </div>
      </section>

      <section id="dev-panel" class="hidden">
        <div class="dev-card">
          <header>
            <h3>Dev Mode</h3>
            <button id="dev-close" type="button">×</button>
          </header>
          <div class="dev-body">
            <p class="dev-section">关卡跳转</p>
            <div class="dev-grid">
              <button data-dev-go="intro" type="button">序章·对话</button>
              <button data-dev-go="prologue" type="button">序章·探索</button>
              <button data-dev-go="level1" type="button">第1关</button>
              <button data-dev-go="level2" type="button">第2关</button>
              <button data-dev-go="level3" type="button">第3关</button>
              <button data-dev-go="level4" type="button">第4关</button>
              <button data-dev-go="level5" type="button">第5关</button>
              <button data-dev-go="finalelook" type="button">终局·注视</button>
              <button data-dev-go="finalechase" type="button">终局·追逐</button>
              <button data-dev-go="epilogue" type="button">尾声</button>
              <button data-dev-go="win" type="button">胜利</button>
            </div>
            <p class="dev-section">辅助</p>
            <div class="dev-grid dev-actions">
              <button id="dev-give-camera" type="button">给予相机</button>
              <button id="dev-force-clear" type="button">强制通关</button>
              <button id="dev-colliders" type="button">碰撞框</button>
              <button id="dev-no-enemy" type="button">隐藏敌人</button>
              <button id="dev-noclip" type="button">穿墙</button>
            </div>
            <p id="dev-hint" class="hidden"></p>
          </div>
          <footer>
            <span>Ctrl+Shift+D 切换</span>
            <span>移除: 删 devtools.js + 3行 main.js + 本面板</span>
          </footer>
        </div>
      </section>

      <p id="boot-error" class="hidden"></p>
    </div>
    <script>
      function showServeHint() {
        var el = document.getElementById('boot-error');
        el.innerHTML =
          '<span>游戏没有启动：直接双击 index.html 时，浏览器会拦住游戏脚本，按钮点了也没反应。<br><br>' +
          '请双击 <b>w05_3d_game/start.bat</b>，它会自动打开游戏。<br>' +
          '或者在 w05_3d_game 目录运行 <code>node server.js</code>，再打开 ' +
          '<a href="http://127.0.0.1:5173">http://127.0.0.1:5173</a></span>';
        el.classList.remove('hidden');
      }
      if (location.protocol === 'file:') showServeHint();
    </script>
    <script type="module" src="./src/main.js" onerror="showServeHint()"></script>
  </body>
</html>
